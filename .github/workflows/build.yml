name: Build R1zz
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract and locate
        run: |
          unzip -o r1zz-source-1.0.0.zip -d source
          echo "=== Structure ==="
          find source -maxdepth 3 -type f -name "build.gradle" -o -name "gradlew"

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build
        run: |
          cd source
          # Find where build.gradle is
          PROJECT_DIR=$(find . -maxdepth 2 -name "build.gradle" -exec dirname {} \; | head -1)
          echo "Project dir: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew build --no-daemon

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: r1zz-jar
          path: source/**/build/libs/*.jar
